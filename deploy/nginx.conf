server {
  listen 80;
  server_name _;

  client_max_body_size 25m;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto http;
  proxy_set_header X-Real-IP $remote_addr;

  location = /api/v1/realtime/events {
    proxy_pass http://api:3001/api/v1/realtime/events;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location /api/v1/ {
    proxy_pass http://api:3001/api/v1/;
  }

  location = /_next/webpack-hmr {
    proxy_pass http://web:3000/_next/webpack-hmr;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
  }

  location /.well-known/ {
    proxy_pass http://api:3001/.well-known/;
  }

  location = /oauth/authorize {
    proxy_pass http://api:3001/oauth/authorize;
  }

  location = /oauth/authorize/approve {
    proxy_pass http://api:3001/oauth/authorize/approve;
  }

  location = /oauth/token {
    proxy_pass http://api:3001/oauth/token;
  }

  location = /oauth/register {
    proxy_pass http://api:3001/oauth/register;
  }

  location = /oauth/revoke {
    proxy_pass http://api:3001/oauth/revoke;
  }

  location / {
    proxy_pass http://web:3000;
  }
}
